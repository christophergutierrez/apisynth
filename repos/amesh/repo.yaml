repo:
  name: amesh
  path: /mnt/storage/git_home/amesh
  language: python
  # First-party Python library only (python/src + python/amesh_vault_client).
  include:
    - "python/**/*.py"
  # Exclude test suites and vendored/build dirs. NOTE: scan_repo's ** glob only
  # matches directory patterns when they end in a filename glob (e.g. "*.py"),
  # so test-dir excludes are written as ".../*.py" rather than ".../**".
  exclude:
    - "python/tests/*.py"
    - "**/tests/*.py"
    - "**/tests/**/*.py"
    - "**/__pycache__/*.py"
    - "**/.venv/*.py"
    - "**/site-packages/*.py"
    - "**/conftest.py"

extraction:
  units:
    - functions
    - methods
    - classes
    - api_calls

generation:
  # Capture every first-party unit (~3,863); high cap = no down-sampling.
  target_records: 10000
  holdout_ratio: 0.20
  # Representative holdout: ~20% within EACH unit type (fixes small-stratum skew
  # such as api_call, which has only ~105 units). See Phase 3.1.
  holdout_strategy: stratified
  thinking_style: deterministic
