endpoint:
  vendor: videoamp
  name: episode
  method: GET
  path: /external/v1/content/episodes/{episodeId}
  base_url: https://api.videoamp.dev/external/v1/content/episodes
  note: Single-resource lookup by path param — no query params
auth:
  type: bearer
  env_var: VIDEOAMP_ACCESS_TOKEN
  cli_fallback: videoamp config get --key access_token
limits:
  workers: 2
  per_user_rpm: 400
  per_tenant_rph: 4000
params: {}
path_params:
  episodeId:
    type: integer
    required: true
    label: episode ID
    note: Sequential IDs starting from low numbers — pre-seeded below
training:
  target_per_variant: 30
  output: data/{vendor}/{name}/training.jsonl
  log: data/{vendor}/{name}/run.log.jsonl
status:
  episodeId:
    valid_values:
    - 1
    - 2
    - 3
    - 4
    - 5
    - 10
    - 25
    - 50
    - 100
    - 500
    swept_through: null
    swept_at: null
  variants:
  - params:
    - episodeId
    confirmed: true
    target: 30
