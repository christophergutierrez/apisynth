endpoint:
  vendor: videoamp
  name: networks
  method: GET
  path: /external/v1/content/networks
  base_url: https://api.videoamp.dev/external/v1/content/networks
auth:
  type: bearer
  env_var: VIDEOAMP_ACCESS_TOKEN
  cli_fallback: videoamp config get --key access_token
limits:
  workers: 2
  per_user_rpm: 400
  per_tenant_rph: 4000
params:
  pageSize:
    type: integer
    required: false
    default: 50
    label: page size
    cli_flag: page-size
  pageToken:
    type: string
    required: false
    label: page token
    cli_flag: page-token
    example: CAU=
  currencyOfRecord:
    type: integer
    required: false
    label: currency of record
    alias: CoR
    cli_flag: cor
  name:
    type: string
    required: false
    label: name search
    cli_flag: name
    note: Case-insensitive fuzzy match against network name
  mediaGroupName:
    type: string
    required: false
    label: media group name
    cli_flag: media-group-name
    note: Filter by media group name
training:
  target_per_variant: 30
  output: data/{vendor}/{name}/training.jsonl
  log: data/{vendor}/{name}/run.log.jsonl
status:
  currencyOfRecord:
    valid_values:
    - 23
    - 25
    - 26
    - 27
    swept_through: null
    swept_at: null
  variants:
  - params:
    - pageSize
    confirmed: true
    target: 30
  - params:
    - pageSize
    - pageToken
    confirmed: true
    target: 30
  - params:
    - currencyOfRecord
    - pageSize
    confirmed: true
    target: 30
  - params:
    - currencyOfRecord
    - pageSize
    - pageToken
    confirmed: true
    target: 30
