endpoint:
  vendor: videoamp
  name: audience-exports
  method: GET
  path: /v1/audiences/{audienceId}/exports
  base_url: https://api.videoamp.dev/v1/audiences
  note: audienceId is a required path param (UUID or integer) — must come from audiences
    list
auth:
  type: bearer
  env_var: VIDEOAMP_ACCESS_TOKEN
  cli_fallback: videoamp config get --key access_token
limits:
  workers: 2
  per_user_rpm: 400
  per_tenant_rph: 4000
path_params:
  audienceId:
    type: string
    required: true
    label: audience ID (UUID or integer)
    note: Cannot be swept numerically — must come from audiences list
params:
  pageSize:
    type: integer
    required: false
    default: 50
    label: page size
    cli_flag: page-size
  pageToken:
    type: string
    required: false
    label: page token
    cli_flag: page-token
    example: CAU=
  sorts:
    type: string
    required: false
    label: sort order
    cli_flag: sorts
    values:
    - -created_at
    - +created_at
    - -audience_id
    - +audience_id
    - -export_type
    - +export_type
    - -status
    - +status
training:
  target_per_variant: 30
  output: data/{vendor}/{name}/training.jsonl
  log: data/{vendor}/{name}/run.log.jsonl
status:
  audienceId:
    valid_values:
    - 232962
    swept_through: null
    swept_at: null
  variants:
  - params:
    - audienceId
    confirmed: true
    target: 30
