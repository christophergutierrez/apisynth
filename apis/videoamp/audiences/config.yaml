endpoint:
  vendor: videoamp
  name: audiences
  method: GET
  path: /v1/audiences
  base_url: https://api.videoamp.dev/v1/audiences
auth:
  type: bearer
  env_var: VIDEOAMP_ACCESS_TOKEN
  cli_fallback: videoamp config get --key access_token
limits:
  workers: 2
  per_user_rpm: 400
  per_tenant_rph: 4000
params:
  pageSize:
    type: integer
    required: false
    default: 50
    label: page size
    cli_flag: page-size
  pageToken:
    type: string
    required: false
    label: page token
    cli_flag: page-token
    example: CAU=
  status:
    type: string
    required: false
    label: status filter
    cli_flag: status
    values:
    - ready
    - failed
    - processing
    - draft
  type:
    type: string
    required: false
    label: audience type
    cli_flag: type
    values:
    - advanced
    - demo
    - shared
    - owned
    - linear_commercial
    - exposure
    - content
  level:
    type: string
    required: false
    label: audience level
    cli_flag: level
    values:
    - HOUSEHOLD
    - PERSON
  orderBy:
    type: string
    required: false
    label: sort order
    cli_flag: order-by
    values:
    - desc(createdAt)
    - asc(createdAt)
    - desc(name)
    - asc(name)
  query:
    type: string
    required: false
    label: name/description search
    cli_flag: query
    note: Case-insensitive filter against name or description
  useCases:
    type: string
    required: false
    label: use case filter
    cli_flag: use-cases
    values:
    - measurement
    - activation
  year:
    type: string
    required: false
    label: broadcast year
    cli_flag: year
    note: 'Applies to demo audiences only. Format: YYYY (2020–2099)'
training:
  target_per_variant: 30
  output: data/{vendor}/{name}/training.jsonl
  log: data/{vendor}/{name}/run.log.jsonl
status:
  variants:
  - params:
    - pageSize
    confirmed: true
    target: 30
  - params:
    - pageSize
    - pageToken
    confirmed: true
    target: 30
  - params:
    - pageSize
    - status
    confirmed: true
    target: 30
  - params:
    - pageSize
    - type
    confirmed: true
    target: 30
  - params:
    - pageSize
    - pageToken
    - status
    confirmed: true
    target: 30
  - params:
    - pageSize
    - pageToken
    - type
    confirmed: true
    target: 30
  - params:
    - pageSize
    - status
    - type
    confirmed: true
    target: 30
  - params:
    - pageSize
    - pageToken
    - status
    - type
    confirmed: true
    target: 30
