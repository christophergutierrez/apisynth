endpoint:
  vendor: videoamp
  name: episodes
  method: GET
  path: /external/v1/content/episodes
  base_url: https://api.videoamp.dev/external/v1/content/episodes
auth:
  type: bearer
  env_var: VIDEOAMP_ACCESS_TOKEN
  cli_fallback: videoamp config get --key access_token
limits:
  workers: 2
  per_user_rpm: 400
  per_tenant_rph: 4000
params:
  pageSize:
    type: integer
    required: false
    default: 50
    label: page size
    cli_flag: page-size
  pageToken:
    type: string
    required: false
    label: page token
    cli_flag: page-token
    example: CAU=
  networkId:
    type: integer
    required: false
    label: network ID
    cli_flag: network-id
    sweep:
      start: 1
      stop_after_misses: 10
      hint_max: 50
  programId:
    type: integer
    required: false
    label: program ID
    cli_flag: program-id
    sweep:
      start: 1
      stop_after_misses: 20
      hint_max: 5000
  currencyOfRecord:
    type: integer
    required: false
    label: currency of record
    alias: CoR
    cli_flag: cor
training:
  target_per_variant: 30
  output: data/{vendor}/{name}/training.jsonl
  log: data/{vendor}/{name}/run.log.jsonl
status:
  networkId:
    valid_values:
