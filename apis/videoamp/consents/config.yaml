endpoint:
  vendor: videoamp
  name: consents
  method: GET
  path: /v1/consents
  base_url: https://api.videoamp.dev/v1/consents
auth:
  type: bearer
  env_var: VIDEOAMP_ACCESS_TOKEN
  cli_fallback: videoamp config get --key access_token
limits:
  workers: 2
  per_user_rpm: 400
  per_tenant_rph: 4000
params:
  pageSize:
    type: integer
    required: false
    default: 50
    label: page size
    cli_flag: page-size
  pageToken:
    type: string
    required: false
    label: page token
    cli_flag: page-token
    example: CAU=
  fetchRecipientAncestorPath:
    type: boolean
    required: false
    default: true
    label: include recipient ancestor path
    cli_flag: fetch-recipient-ancestor-path
  q:
    type: string
    required: false
    label: advanced query
    cli_flag: q
    note: "Structured filter string. Examples:\n  recipient_kind EQ ADVERTISER\n \
      \ recipient_kind IN AD_AGENCY, ADVERTISER\n  recipient_name CONTAINS Acme AND\
      \ recipient_kind EQ ADVERTISER\n"
training:
  target_per_variant: 30
  output: data/{vendor}/{name}/training.jsonl
  log: data/{vendor}/{name}/run.log.jsonl
status:
  variants:
  - params:
    - pageSize
    confirmed: true
    target: 30
  - params:
    - pageSize
    - pageToken
    confirmed: true
    target: 30
