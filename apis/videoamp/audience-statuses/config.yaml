endpoint:
  vendor: videoamp
  name: audience-statuses
  method: GET
  path: /v1/audiences/status
  base_url: https://api.videoamp.dev/v1/audiences/status
auth:
  type: bearer
  env_var: VIDEOAMP_ACCESS_TOKEN
  cli_fallback: videoamp config get --key access_token
limits:
  workers: 2
  per_user_rpm: 400
  per_tenant_rph: 4000
params:
  pageSize:
    type: integer
    required: false
    default: 50
    label: page size
    cli_flag: page-size
  pageToken:
    type: string
    required: false
    label: page token
    cli_flag: page-token
    example: CAU=
  status:
    type: string
    required: false
    label: status filter
    cli_flag: status
    values:
    - ready
    - failed
    - processing
    - draft
  orderBy:
    type: string
    required: false
    label: sort order
    cli_flag: order-by
    values:
    - desc(createdAt)
    - asc(createdAt)
    - desc(name)
    - asc(name)
training:
  target_per_variant: 30
  output: data/{vendor}/{name}/training.jsonl
  log: data/{vendor}/{name}/run.log.jsonl
status:
  variants:
  - params:
    - pageSize
    confirmed: true
    target: 30
  - params:
    - pageSize
    - pageToken
    confirmed: true
    target: 30
  - params:
    - pageSize
    - status
    confirmed: true
    target: 30
  - params:
    - pageSize
    - pageToken
    - status
    confirmed: true
    target: 30
