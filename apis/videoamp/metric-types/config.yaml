endpoint:
  vendor: videoamp
  name: metric-types
  method: GET
  path: /external/v1/content/metric-type-compatibility-matrix
  base_url: https://api.videoamp.dev/external/v1/content/metric-type-compatibility-matrix
  note: No query params — returns the full compatibility matrix in one call
auth:
  type: bearer
  env_var: VIDEOAMP_ACCESS_TOKEN
  cli_fallback: videoamp config get --key access_token
limits:
  workers: 2
  per_user_rpm: 400
  per_tenant_rph: 4000
params: {}
training:
  target_per_variant: 30
  output: data/{vendor}/{name}/training.jsonl
  log: data/{vendor}/{name}/run.log.jsonl
status:
  variants:
  - params: []
    confirmed: true
    target: 30
