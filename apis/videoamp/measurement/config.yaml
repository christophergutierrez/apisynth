endpoint:
  vendor: videoamp
  name: measurement
  method: GET
  path: /external/v1/measurements/{id}
  base_url: https://api.videoamp.dev/external/v1/measurements
  note: Single-resource lookup by UUID — requestId from the measurements list
auth:
  type: bearer
  env_var: VIDEOAMP_ACCESS_TOKEN
  cli_fallback: videoamp config get --key access_token
limits:
  workers: 2
  per_user_rpm: 400
  per_tenant_rph: 4000
params: {}
path_params:
  id:
    type: string
    required: true
    label: measurement UUID (requestId)
    note: UUIDs come from GET /external/v1/measurements — seeded below
training:
  target_per_variant: 30
  output: data/{vendor}/{name}/training.jsonl
  log: data/{vendor}/{name}/run.log.jsonl
status:
  id:
    valid_values:
    - cdd63ab5-2de5-47e4-97dc-7fb86f1600e0
    swept_through: null
    swept_at: null
  variants:
  - params:
    - id
    confirmed: true
    target: 30
