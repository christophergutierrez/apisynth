endpoint:
  vendor: videoamp
  name: measurements
  method: GET
  path: /external/v1/measurements
  base_url: https://api.videoamp.dev/external/v1/measurements
auth:
  type: bearer
  env_var: VIDEOAMP_ACCESS_TOKEN
  cli_fallback: videoamp config get --key access_token
limits:
  workers: 2
  per_user_rpm: 400
  per_tenant_rph: 4000
params:
  pageSize:
    type: integer
    required: false
    default: 100
    label: page size
    cli_flag: page-size
  pageToken:
    type: string
    required: false
    label: page token
    cli_flag: page-token
    example: CAU=
  currencyOfRecord:
    type: integer
    required: false
    label: currency of record
    alias: CoR
    cli_flag: cor
  status:
    type: string
    required: false
    label: status filter
    cli_flag: status
    values:
    - failed
    - processing
    - ready
  name:
    type: string
    required: false
    label: name search
    cli_flag: name
    note: Fuzzy match against measurement name
  createdAt:
    type: string
    required: false
    label: created date
    cli_flag: created-at
    note: 'Format: YYYY-MM-DD — returns measurements created on that day'
  orderBy:
    type: string
    required: false
    label: sort order
    cli_flag: order-by
    values:
    - -createdAt
    - +createdAt
    - +name
    - -name
    - -status
    - +status
training:
  target_per_variant: 30
  output: data/{vendor}/{name}/training.jsonl
  log: data/{vendor}/{name}/run.log.jsonl
status:
  currencyOfRecord:
    valid_values:
    - 23
    - 25
    - 26
    - 27
    swept_through: null
    swept_at: null
  variants:
  - params:
    - pageSize
    confirmed: true
    target: 30
  - params:
    - pageSize
    - pageToken
    confirmed: false
    target: 30
  - params:
    - currencyOfRecord
    - pageSize
    confirmed: true
    target: 30
  - params:
    - pageSize
    - status
    confirmed: true
    target: 30
  - params:
    - currencyOfRecord
    - pageSize
    - pageToken
    confirmed: false
    target: 30
  - params:
    - pageSize
    - pageToken
    - status
    confirmed: false
    target: 30
  - params:
    - currencyOfRecord
    - pageSize
    - status
    confirmed: true
    target: 30
  - params:
    - currencyOfRecord
    - pageSize
    - pageToken
    - status
    confirmed: false
    target: 30
