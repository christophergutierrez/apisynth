endpoint:
  vendor: videoamp
  name: me
  method: GET
  path: /v1/me
  base_url: https://api.videoamp.dev/v1/me
  note: No params — returns current user details. Training data is phrasing variety
    only.
auth:
  type: bearer
  env_var: VIDEOAMP_ACCESS_TOKEN
  cli_fallback: videoamp config get --key access_token
limits:
  workers: 2
  per_user_rpm: 400
  per_tenant_rph: 4000
params: {}
training:
  target_per_variant: 30
  output: data/{vendor}/{name}/training.jsonl
  log: data/{vendor}/{name}/run.log.jsonl
status:
  variants:
  - params: []
    confirmed: true
    target: 30
